# Maintains the release PR and cuts tags from Conventional Commits, same
# setup as mcp-hangar / helm-charts / docs. Merging the release PR creates
# the vX.Y.Z tag and GitHub Release; the existing tag-triggered release.yml
# then builds and signs the image.
#
# The tag-push trigger only fires by itself when the tag was created with a
# GitHub App token (same app-token pattern as the other repos). On the
# GITHUB_TOKEN fallback, events caused by the default token do not cascade,
# so this workflow dispatches release.yml on the fresh tag explicitly --
# gated to the fallback path to avoid running the image build twice.
#
# release-please no longer writes CHANGELOG.md (`skip-changelog: true`). The
# last step folds the per-PR fragments in changelog.d/ and upgrade.d/ into
# CHANGELOG.md and UPGRADE.md on the release branch, as mcp-hangar core does.
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch release.yml on the GITHUB_TOKEN fallback path

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      # Only the assembly step reads the tree. Full history and tags, not a
      # shallow clone: it reads the squash commit that ADDED each fragment
      # (that is where the PR number comes from) and the newest tag (the
      # compare link). Both are invisible at fetch-depth 1.
      #
      # No persisted credential. Checkout otherwise leaves GITHUB_TOKEN in
      # git's config as an Authorization header, which git sends in preference
      # to the app token the assembly step puts in its push URL -- so the push
      # would be attributed to `github-actions[bot]` and start no checks on the
      # release PR (core #1379). release-please writes through the API, and the
      # repository is public, so the assembler's fetch needs no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: ${{ env.RELEASE_BOT_APP_ID != '' }}
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # An app that is configured and yields no token is a credential problem,
      # and everything downstream silently degrades to GITHUB_TOKEN: the
      # assembly push starts no checks on the release PR (core #1180).
      - name: Say so when the release app produced no token
        if: ${{ env.RELEASE_BOT_APP_ID != '' && steps.app-token.outputs.token == '' }}
        run: |
          echo "::warning::RELEASE_BOT_APP_ID is configured but the app token step produced nothing;"\
               "falling back to GITHUB_TOKEN. Check the app installation and its permissions."

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Dispatch release.yml (GITHUB_TOKEN fallback only)
        if: ${{ steps.release.outputs.release_created == 'true' && steps.app-token.outputs.token == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release.outputs.tag_name }}"

      # Fold changelog.d/ and upgrade.d/ into a version section on the release
      # branch, so the release PR carries the notes and merging it lands bump +
      # notes in one squash commit.
      #
      # Pushed with the app token so the push starts the release PR's checks:
      # a push made with GITHUB_TOKEN starts no workflows, and the required
      # checks would sit "expected" on the new head. Without the app token the
      # script falls back to GITHUB_TOKEN, then re-fires the checks by closing
      # and reopening the PR, and says what to run by hand if that is not
      # enough.
      #
      # Deliberately last: it checks out the release branch.
      - name: Assemble the changelog on the release PR
        if: ${{ steps.release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: bash scripts/assemble_release_changelog.sh
