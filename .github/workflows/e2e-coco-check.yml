name: e2e coco check

# The parts of the kbs-attested end-to-end harness (T26,
# mcp-hangar/mcp-hangar#1950) that run without KVM: the KBS resource policy's
# tests, and the upstream image serving the key a stub CDH releases. The run
# with Confidential Containers itself needs a runner with /dev/kvm and is not
# wired here.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "test/e2e/coco/**"
      - ".github/workflows/e2e-coco-check.yml"

permissions:
  contents: read

concurrency:
  group: e2e-coco-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coco-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: KBS policy and upstream image
        run: make e2e-coco-check
