# Go CI gate: build, vet, race-tested (via setup-envtest) and lint. Runs on
# every PR into main and on pushes to main. See issue #14.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same ref (a new push to a PR/branch supersedes
# the in-flight run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with Makefile's ENVTEST_K8S_VERSION so a local `make test` and
  # CI agree about which apiserver the suite ran against.
  ENVTEST_K8S_VERSION: "1.34.1"
  # The oldest Kubernetes the operator supports (decided on issue 217). A 1.30
  # apiserver compiles CRD CEL rules against an older library set than 1.34
  # does, so a rule using isCIDR() passes on ENVTEST_K8S_VERSION and refuses to
  # install on 1.30 (measured in PR 240). test-k8s-floor runs the suite there.
  ENVTEST_K8S_FLOOR: "1.30.3"
  # The apiserver the generated CRDs must install on, pinned by digest so a kind
  # release cannot silently change what "current Kubernetes" means here. 1.36 is
  # deliberate: it is the version that rejected the CRD in #54.
  KIND_NODE_IMAGE: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Run tests (race)
        run: |
          set -euo pipefail
          KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_VERSION" -p path)"
          export KUBEBUILDER_ASSETS
          go test -race ./...

  # Same suite on the supported floor: the CRDs (with their CEL rules) are
  # installed into a 1.30 apiserver and every controller test runs against it.
  # No -race: the test job above covers that, and this leg is about the API.
  test-k8s-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Run tests on the Kubernetes floor
        run: |
          set -euo pipefail
          KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_FLOOR" -p path)"
          export KUBEBUILDER_ASSETS
          go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # Read the pin out of the Makefile so `make lint` and this job cannot
      # drift apart. They did: the Makefile sat on v1.55.2 against a v2-format
      # .golangci.yml for long enough that `make lint` was broken locally while
      # CI stayed green, and every contributor had to know to ignore it.
      - name: Resolve the pinned golangci-lint version
        id: golangci
        run: |
          version="$(sed -n 's/^GOLANGCI_LINT_VERSION ?= //p' Makefile)"
          test -n "$version" || { echo "::error::GOLANGCI_LINT_VERSION not found in Makefile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.golangci.outputs.version }}

  # The release-note tooling in scripts/ (changelog.d/ and upgrade.d/ folding,
  # the changelog gate, the release-branch push). It runs unattended on the
  # release PR, so a break has to surface here rather than on release day.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --quiet pytest pyyaml
      - name: Script tests
        run: python -m pytest scripts/tests -q
      - name: Pending fragments render
        run: python scripts/build_changelog.py check

  # Does what this repo generates actually install on a current Kubernetes?
  #
  # `make test` could not answer that for the CRDs' CEL rules, and for a while
  # nothing could: the envtest suite stripped x-kubernetes-validations before
  # handing the CRDs over, so an invalid rule was invisible at every version.
  # That is how a rule reading `self.metadata.annotations` -- a field CRD
  # validation CEL does not expose -- shipped in a release and failed at
  # `kubectl apply` on k8s 1.36 (#30, #54).
  #
  # The stripping is gone, so the suite now catches a bad rule too. This job
  # covers what the suite structurally cannot: that the YAML in
  # config/crd/bases is what the types generate, and that a REAL apiserver
  # Establishes it. Fast on purpose -- no CNI, no operator, no CRs.
  crd-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # A stale config/crd/bases would let this job pass against yesterday's
      # CRDs while the types say something else.
      - name: Manifests are up to date
        run: |
          set -euo pipefail
          make manifests
          if ! git diff --quiet -- config/crd/bases; then
            echo "::error::config/crd/bases is stale -- run 'make manifests' and commit the result."
            git diff --stat -- config/crd/bases
            exit 1
          fi

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: crd-install
          node_image: ${{ env.KIND_NODE_IMAGE }}

      # Client-side on purpose: it is what `kubectl apply -f install.yaml`
      # does, and it stores the whole object in a last-applied annotation
      # capped at 256 KiB. Server-side apply would not notice a CRD outgrowing
      # it (#198).
      - name: Install the generated CRDs (client-side apply)
        run: |
          set -euo pipefail
          kubectl apply -f config/crd/bases/

      # apply succeeding is not the assertion: a CRD can be accepted and then
      # fail to Establish. Waiting on the condition is what proves it is usable.
      - name: Every CRD reaches Established
        run: |
          set -euo pipefail
          names="$(kubectl get crd -o name -l '' | grep 'mcp-hangar.io' || true)"
          if [ -z "$names" ]; then
            echo "::error::no mcp-hangar.io CRDs found after apply"
            exit 1
          fi
          echo "$names"
          # shellcheck disable=SC2086
          kubectl wait --for=condition=Established --timeout=60s $names
