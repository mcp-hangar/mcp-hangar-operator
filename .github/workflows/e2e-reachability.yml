name: e2e reachability

# Does the NetworkPolicy this operator builds actually block traffic?
#
# `make test` cannot answer that. The unit tests in pkg/networkpolicy assert on
# API objects -- 104 assertions, none of which observe a packet -- and envtest is
# an apiserver plus etcd with no controller-manager and no CNI, so a
# NetworkPolicy there is a stored document and nothing more.
#
# Nightly rather than per-PR: it builds a cluster and installs a CNI, which is
# minutes and depends on pulling images from two registries. Making that a
# required check would trade a real signal for a flaky one. A failure here means
# the operator's L3/L4 enforcement stopped working, which is worth a morning's
# attention rather than a blocked merge.

on:
  schedule:
    # 03:20 UTC, before the working day and off the top of the hour to avoid the
    # cron stampede that delays scheduled jobs on shared runners.
    - cron: "20 3 * * *"
  workflow_dispatch:
  pull_request:
    # Run on PRs that touch the policy builders or the harness itself, so a
    # change to what is generated is checked against what is enforced before it
    # lands -- not the next morning.
    paths:
      - "pkg/networkpolicy/**"
      - "internal/controller/**"
      - "api/**"
      - "test/e2e/**"
      - ".github/workflows/e2e-reachability.yml"

permissions:
  contents: read

concurrency:
  group: e2e-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A Calico regression and a Cilium regression are independent signals;
      # do not let one hide the other.
      fail-fast: false
      matrix:
        # calico exercises the Vanilla NetworkPolicy path (CIDR peers).
        # cilium is the only CNI that enforces the toFQDNs rules the Cilium
        # flavor emits (issue #110) -- without this leg, the feature's headline
        # capability is covered by API-object assertions only.
        # cilium-nodelocaldns is the same CNI with a per-node DNS cache as the
        # resolver (issue #145). It is a third leg rather than a change to the
        # second: a cluster whose pods resolve through kube-dns and one whose
        # pods resolve through a link-local cache are different claims, and
        # folding them together would retire the plain one.
        include:
          - leg: calico
            cni: calico
            nodelocaldns: ""
          - leg: cilium
            cni: cilium
            nodelocaldns: ""
          - leg: cilium-nodelocaldns
            cni: cilium
            nodelocaldns: "1"
    name: reachability (${{ matrix.leg }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create kind cluster with ${{ matrix.cni }}
        # kind's default CNI (kindnet) does NOT enforce NetworkPolicy. Running
        # these tests on it would pass every deny assertion for the wrong
        # reason, which is worse than not running them.
        run: make e2e-cluster E2E_CNI=${{ matrix.cni }} E2E_NODELOCAL_DNS=${{ matrix.nodelocaldns }}

      - name: Reachability tests
        run: make e2e E2E_CNI=${{ matrix.cni }} E2E_NODELOCAL_DNS=${{ matrix.nodelocaldns }}

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get networkpolicies -A -o yaml || true
          kubectl get ciliumnetworkpolicies -A -o yaml || true
          kubectl -n kube-system logs -l k8s-app=calico-node --tail=100 || true
          kubectl -n kube-system logs -l k8s-app=cilium --tail=100 || true
          kubectl -n kube-system logs -l k8s-app=node-local-dns --tail=100 || true
          kubectl -n kube-system get daemonset node-local-dns -o wide || true

      - name: Tear down
        if: always()
        run: make e2e-clean
