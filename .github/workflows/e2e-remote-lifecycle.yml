name: e2e remote lifecycle

# Does a mode:remote MCPServer actually reach Ready against a LIVE core? (#106)
#
# The path half of this question is answered per-PR by route_contract_test.go
# plus the weekly route-inventory drift check. What neither can see is response
# SHAPE (a renamed consecutive_failures decodes as zeros) and the CR lifecycle
# around it -- both #91 and #103 shipped through mocked HTTP tests precisely
# because a mock always agrees with its author. This boots the released
# operator against a pinned stable core on kind and asserts what only that
# pairing can show.
#
# Nightly rather than a required per-PR check: it pulls a ~large core image,
# builds a backend image and waits out a 2-minute probe-cadence window. The
# cron slot is 03:40 UTC -- off the top of the hour, and not 03:20, where the
# reachability e2e already runs.

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  pull_request:
    # Run on PRs that touch the core client or this harness, so a change to
    # what is decoded is checked against a live core before it lands.
    paths:
      - "pkg/hangar/**"
      - "test/e2e/remote/**"
      - ".github/workflows/e2e-remote-lifecycle.yml"

permissions:
  contents: read

concurrency:
  group: e2e-remote-lifecycle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same node image the crd-install job pins, digest and all, so "current
  # Kubernetes" means the same thing across this repo's clusters-in-CI.
  KIND_NODE_IMAGE: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"

jobs:
  remote-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Boot core + backend + operator on kind
        run: make e2e-remote-up

      - name: Remote lifecycle tests
        run: make e2e-remote

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get mcpservers -A -o yaml || true
          kubectl -n mcp-hangar logs -l control-plane=controller-manager --tail=200 || true
          kubectl -n hangar-e2e logs -l app=mcp-hangar --tail=200 || true
          kubectl -n hangar-e2e logs -l app=task-upstream --tail=100 || true

      - name: Tear down
        if: always()
        run: make e2e-remote-clean
