apiVersion: mcp-hangar.io/v1alpha2
kind: MCPDiscoverySource
metadata:
  labels:
    app.kubernetes.io/name: mcp-hangar-operator
    app.kubernetes.io/managed-by: kustomize
  name: mcpdiscoverysource-sample
spec:
  type: Namespace
  mode: Additive
  paused: false
  # A namespace names no Service, so the endpoint every discovered server dials
  # comes from the template (#329).
  namespaceSelector:
    matchLabels:
      mcp-hangar.io/discover: "true"
  providerTemplate:
    spec:
      mode: remote
      endpoint: http://mcp-gateway.mcp-system.svc.cluster.local:8080/mcp
