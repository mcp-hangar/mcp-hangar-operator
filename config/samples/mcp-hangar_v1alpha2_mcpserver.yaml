apiVersion: mcp-hangar.io/v1alpha2
kind: MCPServer
metadata:
  labels:
    app.kubernetes.io/name: mcp-hangar-operator
    app.kubernetes.io/managed-by: kustomize
  name: mcpserver-sample
spec:
  mode: container
  image: ghcr.io/example/mcp-example-server:latest
  replicas: 1
  # spec.resources is corev1.ResourceRequirements: any resource name, values
  # parsed as quantities.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # spec.env is corev1.EnvVar, so fieldRef/resourceFieldRef work too.
  env:
    - name: LOG_LEVEL
      value: info
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
