# Bind this to the scraper's ServiceAccount (Prometheus, for example): the
# metrics endpoint serves HTTPS and admits only a bearer token allowed to get
# the /metrics non-resource URL (#193).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mcp-hangar-operator
    app.kubernetes.io/managed-by: kustomize
  name: metrics-reader
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
