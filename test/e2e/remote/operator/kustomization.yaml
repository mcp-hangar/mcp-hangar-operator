# Operator install for the remote-lifecycle e2e (#106).
#
# Deliberately NOT config/default: that overlay wires the admission/conversion
# webhooks and therefore needs cert-manager, none of which this e2e is about --
# CRD validity is already covered by the crd-install CI job, and the CRDs are
# applied straight from config/crd/bases by up.sh (same as that job).
#
# The image is the one up.sh builds from this checkout and loads into kind
# (#208). It used to be a pinned GHCR release, so the e2e tested a past
# operator against the present CRDs and RBAC and could not see a PR's change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-hangar
namePrefix: mcp-hangar-operator-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: mcp-hangar-operator

resources:
  - ../../../../config/rbac
  - ../../../../config/manager

images:
  # config/manager already rewrites `controller` to the GHCR name with :latest;
  # this overlay swaps in the local build (matching on the post-rewrite name).
  # A tag other than latest keeps imagePullPolicy at IfNotPresent, so the
  # kubelet uses the image kind loaded instead of pulling.
  - name: ghcr.io/mcp-hangar/mcp-hangar-operator
    newName: localhost/mcp-hangar-operator
    newTag: e2e

patches:
  # Point the manager at the live core deployed by manifests/core.yaml.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --hangar-url=http://mcp-hangar.hangar-e2e.svc.cluster.local:8080
