version: "2"
# golangci-lint v2 config. Goal (unchanged from the v1 gate): a conservative,
# PASSING quality gate on the existing code -- not a cleanup sweep. If a check
# is noisy on pre-existing code, scope it here (with a note) rather than churning
# the Go source. staticcheck is limited to the SA* bug analyses to match the v1
# gate's scope; v2 otherwise folds the ST/S/QF *style* checks into `staticcheck`,
# which this gate deliberately does not run.
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - govet         # go vet
    - staticcheck   # SA* analyses only (see settings)
    - ineffassign   # ineffectual assignments
    - unused        # unused code
    - misspell      # common spelling mistakes in comments/strings
    - gosec         # security checks (#216)
    - errorlint     # error comparison/wrapping that breaks errors.Is/As (#216)
    - bodyclose     # unclosed HTTP response bodies (#216)
    - nilerr        # returning nil after checking err != nil (#216)
    - exhaustive    # switches over enums (modes, states) that miss a case (#216)
  settings:
    exhaustive:
      # A default branch is a deliberate catch-all; the check is for switches
      # that silently skip a mode or state.
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # int -> int32 for counts of list items (servers, tools, members) that
        # are bounded far below 2^31 by the API server's request size.
        - G115
    staticcheck:
      checks:
        - "SA*"      # bug-finding analyses only -- matches the pre-v2 gate scope
                     # SA1019 (deprecations) is IN: the controller-runtime v0.24
                     # deprecations it was excluded for are migrated off (#58).
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
          - unused
        path: zz_generated\.deepcopy\.go
      - linters:
          - errcheck
          - unused
        path: _test\.go
      - linters:
          - ineffassign
        path: internal/controller/mcpdiscoverysource_controller\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
